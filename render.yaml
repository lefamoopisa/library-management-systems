services:
  - type: web
    name: community-library
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start:server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LIBRARY_DATABASE_PATH
        value: /var/data/library.sqlite
    disk:
      name: library-data
      mountPath: /var/data
      sizeGB: 1
